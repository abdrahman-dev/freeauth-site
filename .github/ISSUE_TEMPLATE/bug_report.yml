name: Bug report
description: Something on the site is broken or wrong.
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include any console errors.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest path to seeing the problem.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 141 on Windows 11 desktop; Safari on iPhone 15
    validations:
      required: true
